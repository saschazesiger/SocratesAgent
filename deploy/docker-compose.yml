# Socrates as a service: detached, brought back when it dies, and back again
# after a reboot. `docker compose -f deploy/docker-compose.yml up -d` is the
# whole of it, and it is the same container as
#
#   docker run -d --name socrates --restart unless-stopped \
#     -p 8080:8080 -v socrates-data:/data -v /root:/root socrates
#
# written down, so that the mounts and the restart policy are not something you
# have to remember correctly at three in the morning.
#
# `restart: unless-stopped` gets Socrates back at boot only if the Docker
# daemon itself starts at boot - `systemctl enable docker`, which is the
# default on most installs. Nothing else here is needed for that. The policy
# reacts to the container exiting, not to the health check going red: a wedged
# Socrates is reported unhealthy by `docker ps` and left alone.
services:
  socrates:
    image: socrates
    container_name: socrates
    restart: unless-stopped
    ports:
      # Reachable from the network. Use "127.0.0.1:8080:8080" to keep it on
      # this machine and publish it through the Cloudflare tunnel instead -
      # anyone who gets past the password can run commands here.
      - "8080:8080"
    volumes:
      # Everything Socrates remembers: the database, the workspaces, and the
      # HOME the three CLIs keep their credentials and transcripts in.
      - socrates-data:/data
      # The presets in Admin -> Workspace name directories on the host, and the
      # container cannot see one without a mount. This mounts the whole home
      # directory, which is the convenient answer and also the widest: every
      # agent here runs without permission prompts, so it can write anywhere in
      # it. Mounting only the projects you actually work in is the narrow one.
      - /root:/root

volumes:
  socrates-data:
    # The name as it is, without the project prefix Compose would otherwise
    # add: this is the volume `scripts/migrate-to-docker.sh` seeds.
    name: socrates-data
