name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by update-dashboard-style.yml: its push of the new copy is made
  # with GITHUB_TOKEN, which starts no workflow by itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every session is a tmux pane, so the tmux-backed internal/termux tests
      # are the substrate's real regression net. Without this step they would
      # skip themselves silently on both runners and CI would stay green while
      # the product stopped working.
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tmux ncurses-term
          else
            brew list tmux >/dev/null 2>&1 || brew install tmux
          fi
          tmux -V

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # TEMPORARY, for the macOS fixes only: measures what the tests assume.
      - name: Diagnose (temporary)
        if: matrix.os == 'macos-latest'
        run: |
          set +e
          ls -l /bin/sh /private/var/select/sh
          /bin/sh -c 'echo "sh is BASH_VERSION=$BASH_VERSION"'
          command -v timeout gtimeout base64 od yes
          printf 'abc' | base64 -w 90; echo " (base64 -w exit $?)"
          ps -o lstart= -p $$
          ps -eo pid=,ppid= | head -3
          sysctl net.inet.tcp.recvspace net.inet.tcp.sendspace net.inet.tcp.autorcvbufmax net.inet.tcp.autosndbufmax kern.ipc.maxsockbuf
          T="tmux -L socdiag -f /dev/null"
          $T new-session -d -s base -x 100 -y 30 /bin/sh
          $T set-option -g remain-on-exit on
          $T new-session -d -s killed "/bin/sh -c 'sleep 0.5; kill -9 \$\$'"
          sleep 2
          $T list-panes -a -F '#{session_name} dead=#{pane_dead} status=[#{pane_dead_status}] signal=[#{pane_dead_signal}] cmd=[#{pane_current_command}] pid=#{pane_pid}'
          ps -o pid=,ppid=,comm= -p "$($T display-message -p -t base '#{pane_pid}')"
          $T kill-server
          true

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # Every release ships a windows/amd64 binary, so the tree has to compile and
  # vet on Windows on every change. Terminal sessions themselves do not run
  # there: they are tmux panes on a unix socket, so internal/termux has a
  # Windows file that returns termux.ErrUnsupported, the server answers 503 on
  # POST /api/sessions and on the WebSocket, and the binary says so in one line
  # at start-up. The server, the dashboard, the tunnel and voice all work, so
  # the build has to stay green. The test suite is not run here: the termux
  # tests are //go:build !windows, and the rest scripts /bin/sh and sends
  # signals a Windows box does not have. The harness-argv tests do build on
  # Windows and are the part that matters here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
