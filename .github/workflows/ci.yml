name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by update-z-dash.yml: its push of the new copy is made
  # with GITHUB_TOKEN, which starts no workflow by itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every session is a tmux pane, so the tmux-backed internal/termux tests
      # are the substrate's real regression net. Without this step they would
      # skip themselves silently on both runners and CI would stay green while
      # the product stopped working.
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tmux ncurses-term
          else
            brew list tmux >/dev/null 2>&1 || brew install tmux
          fi
          tmux -V

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # The project rules of Z-Dash (its AGENTS.md project block):
      # the copy verifies, every ds- class exists, no removed name, no
      # literal, no own keyframes, no restyle of a ds component outside the
      # exceptions in ds-check.json, each with its reason, and the project
      # bundle the pages load (internal/web/static/ds) is what bundle.mjs
      # writes from the copy and holds every class they use. Node is on the
      # runner; the tool has no dependencies.
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22

      # The bundle the pages load is rebuilt from the copy and compared with
      # the committed one: a ds- class or DS module a change started to use
      # and the bundle lacks fails here (make ds-bundle). Its report,
      # ds.bundle.json, names the lines it found each class on, so it moves
      # with any edit; it is rewritten, not compared, which also lets the
      # bundle rule of the project check below pass on it.
      - name: Z-Dash bundle is fresh
        if: matrix.os == 'ubuntu-latest'
        run: |
          node internal/web/static/vendor/z-dash/tools/bundle.mjs --config internal/web/ds.config.json
          git diff --exit-code --stat -- internal/web/static/ds/ds.bundle.css internal/web/static/ds/ds.bundle.js internal/web/static/ds/properties.css

      - name: Z-Dash project check
        if: matrix.os == 'ubuntu-latest'
        run: node internal/web/static/vendor/z-dash/tools/check-project.mjs --config ds-check.json

      # The default ten minutes per package is not enough room: internal/server
      # alone took 547s on macos-latest and 575s on ubuntu-latest in run
      # 40070833079, every test passing, so one slow runner away from a
      # timeout that says nothing about the code.
      - name: Test
        run: go test -race -timeout 20m ./...

      - name: Build
        run: go build ./...

  # Every release ships a windows/amd64 binary, so the tree has to compile and
  # vet on Windows on every change. Terminal sessions themselves do not run
  # there: they are tmux panes on a unix socket, so internal/termux has a
  # Windows file that returns termux.ErrUnsupported, the server answers 503 on
  # POST /api/sessions and on the WebSocket, and the binary says so in one line
  # at start-up. The server, the dashboard, the tunnel and voice all work, so
  # the build has to stay green. The test suite is not run here: the termux
  # tests are //go:build !windows, and the rest scripts /bin/sh and sends
  # signals a Windows box does not have. The harness-argv tests do build on
  # Windows and are the part that matters here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
