# Keeps the vendored copy of Z-Dash (Dashboard-Style until 2.x) on its
# latest main, and the project bundle the pages load built from it.
#
# From templates/update-z-dash.yml of github.com/saschazesiger/Z-Dash
# (docs/install.md, "Automatic updates"). Once a day it compares the commit in
# <DEST>/VERSION with main of Z-Dash: unchanged, the run ends after that one
# request; changed, it vendors main, verifies the copy against its SHA256SUMS
# (tools/verify.sh), rebuilds the project bundle (tools/bundle.mjs with
# internal/web/ds.config.json, into internal/web/static/ds), runs the project
# check (tools/check-project.mjs with ds-check.json: a name the new copy
# removed fails here, before anything is committed) and the web tests (the
# checksum of the copy, the bundle's version, the stamping of its addresses,
# the pages that load it), commits the copy and the bundle and starts CI.
#
# Why CI has to be started explicitly: a push made with GITHUB_TOKEN does not
# trigger other workflows (GitHub prevents loops), but workflow_dispatch does.
# The one change against the template: Socrates is Go, so the Verify step
# gets Go (SETUP: go), and Node is set up whenever CHECK or BUNDLE needs it,
# which the template does only with SETUP: node.

name: Update Z-Dash

on:
  schedule:
    # Daily at 02:30 UTC. Off the full hour on purpose: scheduled runs at
    # minute 0 queue the longest and are the first GitHub drops under load.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the new copy
  actions: write    # start BUILD_WORKFLOW

concurrency:
  group: update-z-dash
  cancel-in-progress: false

env:
  # Where the copy lives, relative to the repository root.
  DEST: internal/web/static/vendor/z-dash
  # The toolchain of VERIFY (the template's SETUP).
  SETUP: go
  # The project check of the new copy (Z-Dash docs/install.md, "Check a
  # project"; "major": 3 in ds-check.json); Node is set up for it below.
  CHECK: 'node "$DEST/tools/check-project.mjs" --config ds-check.json'
  # The project bundle's config (Z-Dash docs/bundle.md): a new copy makes the
  # old bundle stale, so it is rebuilt and committed with the copy.
  BUNDLE: internal/web/ds.config.json
  # Shell command that must pass before the update is committed. Runs after
  # the copy was replaced and the bundle rebuilt.
  VERIFY: 'go vet ./internal/web/... && go test ./internal/web/... ./internal/server/...'
  # The workflow that checks the whole tree; it has a workflow_dispatch trigger.
  BUILD_WORKFLOW: 'ci.yml'
  REPO: saschazesiger/Z-Dash

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare with main of Z-Dash
        id: compare
        run: |
          current=$(sed -n 's/^commit //p' "$DEST/VERSION" 2>/dev/null || true)
          latest=$(curl -fsSL -H 'Accept: application/vnd.github.sha' "https://api.github.com/repos/$REPO/commits/main")
          echo "current ${current:-none}, latest $latest"
          if [ "$current" = "$latest" ]; then
            echo "Z-Dash is up to date; nothing to build." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Vendor main
        if: steps.compare.outputs.changed == 'true'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$REPO/${{ steps.compare.outputs.latest }}/scripts/vendor.sh" -o "$RUNNER_TEMP/vendor.sh"
          sh "$RUNNER_TEMP/vendor.sh" "${{ steps.compare.outputs.latest }}" "$DEST"
          # The copy verifies itself: every file against SHA256SUMS, nothing added or linked.
          sh "$DEST/tools/verify.sh" "$DEST"

      - uses: actions/setup-node@v5
        if: steps.compare.outputs.changed == 'true' && (env.CHECK != '' || env.BUNDLE != '')
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        if: steps.compare.outputs.changed == 'true' && env.SETUP == 'go' && env.VERIFY != ''
        with:
          go-version-file: go.mod
          cache: true

      - name: Rebuild the bundle
        if: steps.compare.outputs.changed == 'true' && env.BUNDLE != ''
        run: node "$DEST/tools/bundle.mjs" --config "$BUNDLE"

      - name: Check
        if: steps.compare.outputs.changed == 'true' && env.CHECK != ''
        run: ${{ env.CHECK }}

      - name: Verify
        if: steps.compare.outputs.changed == 'true' && env.VERIFY != ''
        run: ${{ env.VERIFY }}

      - name: Commit and push
        id: commit
        if: steps.compare.outputs.changed == 'true'
        run: |
          git add -A -- "$DEST"
          # The rebuilt bundle sits beside its config (its "out" folder).
          if [ -n "$BUNDLE" ]; then git add -A -- "$(dirname "$BUNDLE")"; fi
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Z-Dash to ${{ steps.compare.outputs.latest }}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Updated Z-Dash to ${{ steps.compare.outputs.latest }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Start the build
        if: steps.commit.outputs.pushed == 'true' && env.BUILD_WORKFLOW != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "$BUILD_WORKFLOW" --ref "${{ github.ref_name }}"
