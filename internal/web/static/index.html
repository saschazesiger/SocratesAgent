<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Socrates</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/static/img/logo.png">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/vendor/xterm.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand">
        <img class="mark" src="/static/img/logo.png" alt="" width="24" height="24">
        Socrates
      </div>
      <button class="btn new-chat" id="newSession">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New session
      </button>
      <!-- Archived sessions stay out of the way until they are asked for. -->
      <div class="scope" id="sessionScope" role="group" aria-label="Which sessions to show">
        <button class="seg on" type="button" data-scope="active" aria-pressed="true">Active</button>
        <button class="seg" type="button" data-scope="all" aria-pressed="false">All</button>
      </div>
    </div>
    <nav class="chat-list" id="sessionList"></nav>
    <!-- What a session just did, for a reader that cannot see the sidebar. It
         is the only place the activity of a row is put into words, and it is
         throttled so a busy machine does not talk over itself. -->
    <div class="sr-only" id="activityLive" role="status" aria-live="polite"></div>
    <div class="side-foot">
      <a class="btn" href="/admin">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        Admin
      </a>
      <button class="btn" id="logout">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- The scrim behind the drawer is a real element rather than a pseudo
       element on the body, because it has to be tappable: iOS only delivers a
       click to something that carries a handler of its own, and tapping beside
       a drawer is how a drawer is closed on a phone. -->
  <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <!-- Which program this session runs. A session is bound to one for its
           whole life, so the binding belongs beside the name. -->
      <div class="agent-badge" id="sessionHarness" hidden></div>
      <!-- The name is edited where it is read: a click makes it editable and
           Enter or leaving it commits. -->
      <div class="title" id="sessionTitle">Socrates</div>
      <span class="tag" id="sessionArchived" hidden>Archived</span>
      <!-- The size the pane is actually wearing. It is two numbers and a
           cross, quiet enough to sit beside the name, and it is hidden
           altogether on a narrow screen. -->
      <span class="term-size" id="termSize" hidden></span>
      <!-- What this session is doing, said out loud; what it should do next,
           done for you; and the mode that makes both of them thumb-sized.
           All three are hidden until there is a session to ask about. -->
      <button class="icon-btn" id="statusBtn" title="Say what this is doing" aria-label="Say what this is doing" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-8 8H5.5L4 21.5V12a8 8 0 1 1 16 0z"/></svg>
      </button>
      <button class="icon-btn" id="agentBtn" title="What should I do?" aria-label="What should I do?" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
      </button>
      <!-- Auto mode is a state, not an action, so it is a switch and not a
           pressed button: the knob says which way it is set without anybody
           having to hover it. -->
      <button class="auto-switch" id="audioModeBtn" type="button" role="switch" aria-checked="false"
              title="Auto mode" hidden>
        <span class="auto-word" aria-hidden="true">Auto</span>
        <span class="auto-track"><span class="auto-knob"></span></span>
        <span class="sr-only">Auto mode</span>
      </button>
      <button class="icon-btn" id="sessionMenu" title="Session actions" hidden aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
    </header>

    <!-- The terminal and, beside it, the conversation about it. On a desk they
         are two columns and the pane refits; on a phone the chat is a sheet
         over the pane with a way out of it. -->
    <div class="stage" id="stage">
      <div class="term-wrap" id="termWrap">
        <div class="term-host" id="term"></div>
        <!-- Blocks the terminal: it ended, it could not start, or it is coming
             back after a reboot. -->
        <div class="term-overlay" id="termOverlay" hidden></div>
        <!-- The two lines that may sit over the top of the pane: the notice,
             which is dismissible and never blocks, and under it the ticker,
             which is one line at a time of what is happening right now. -->
        <div class="term-lines" id="termLines">
          <div class="term-notice" id="termNotice" hidden></div>
          <div class="term-ticker" id="termTicker" hidden>
            <div class="ticker-window" id="tickerWindow" role="status" aria-live="polite"></div>
          </div>
        </div>
        <!-- Before the first session exists there is nothing to attach to. -->
        <div class="term-empty" id="termEmpty" hidden></div>
      </div>

      <!-- The chat with the agent. chat.js fills the log and builds the input
           row, which is a text field with a keyboard and one large microphone
           without one. -->
      <aside class="chat-panel" id="chatPanel" hidden aria-label="Ask the agent">
        <header class="chat-head">
          <span class="chat-head-title">Ask</span>
          <button class="icon-btn" id="chatClose" type="button" aria-label="Close the chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <div class="chat-log" id="chatLog"></div>
        <div class="chat-foot" id="chatFoot"></div>
      </aside>
    </div>

    <!-- Audio mode: the terminal stays where it is and simply gets shorter,
         and everything a passenger needs is two buttons a thumb cannot miss.
         assist.js fills them in and decides what they say. -->
    <div class="audio-bar" id="audioBar" hidden>
      <button class="audio-btn" id="audioStatus" type="button">Status</button>
      <button class="audio-btn" id="audioAgent" type="button">Agent</button>
    </div>

    <!-- The keys a phone keyboard does not have, and the field a whole line is
         composed in before it is sent. keybar.js fills both in and decides
         whether the key bar is wanted on this device. -->
    <div class="keybar" id="keybar" hidden></div>
    <form class="composer" id="composer" hidden>
      <input id="lineInput" class="input" type="text"
             autocorrect="off" autocapitalize="none" autocomplete="off" spellcheck="false"
             enterkeyhint="send" placeholder="Type a line…">
      <button class="icon-btn" id="micBtn" type="button" title="Speak" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <span class="rec-time" id="recTime" hidden>0:00</span>
      <button class="btn primary" id="sendLine" type="submit">Send</button>
    </form>
  </main>
</div>

<!-- The new session sheet: which program, where it works, and what it runs on.
     A session is bound to all three before it exists, so they are chosen once
     rather than guessed at and corrected afterwards. -->
<dialog class="sheet" id="newSessionSheet" aria-label="Start a new session">
  <h2 class="sheet-title">What should this session run?</h2>
  <div class="seg-row agents" id="nsHarness" role="group" aria-label="Harness"></div>
  <div class="field" id="nsDirField">
    <label>Working directory</label>
    <div class="seg-row" id="nsDir" role="group" aria-label="Working directory"></div>
    <input class="input mono" type="text" id="nsDirPath" spellcheck="false" hidden
           autocorrect="off" autocapitalize="none" placeholder="/srv/projects/socrates">
    <div class="hint mono" id="nsDirHint"></div>
  </div>
  <div class="field" id="nsModelField">
    <label>Model</label>
    <div id="nsModel"></div>
  </div>
  <div class="field" id="nsEffortField" hidden>
    <label>Effort</label>
    <div class="seg-row" id="nsEffort" role="group" aria-label="Reasoning effort"></div>
  </div>
  <div class="hint" id="nsHint"></div>
  <div class="sheet-actions">
    <button class="btn sm" type="button" id="nsCancel">Cancel</button>
    <button class="btn sm primary" type="button" id="nsStart">Start session</button>
  </div>
</dialog>

<div class="toasts" id="toasts"></div>

<!-- The vendored bundles are plain UMD scripts that define browser globals -
     Terminal, FitAddon, Unicode11Addon, WebLinksAddon, ClipboardAddon,
     WebglAddon - so they come before the module that uses them. They are not
     ESM; nothing imports them. -->
<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/vendor/addon-unicode11.js"></script>
<script src="/static/vendor/addon-web-links.js"></script>
<script src="/static/vendor/addon-clipboard.js"></script>
<script src="/static/vendor/addon-webgl.js"></script>
<script type="module" src="/static/js/session.js"></script>
</body>
</html>
