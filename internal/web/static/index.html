<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Socrates</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/static/img/logo.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/vendor/xterm.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <!-- The name of the thing, and the one control that takes the column
           down to a rail. On a phone the sidebar is already a drawer, so the
           control is not there at all. -->
      <div class="brand-row">
        <div class="brand">
          <img class="mark" src="/static/img/logo.png" alt="" width="24" height="24">
          <span class="brand-name">Socrates</span>
        </div>
        <button class="icon-btn side-toggle" id="sideCollapse" type="button"
                title="Collapse the sidebar" aria-label="Collapse the sidebar"
                aria-expanded="true" aria-controls="sidebar">
          <svg class="ico-wide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M16.5 9.5L14 12l2.5 2.5"/></svg>
          <svg class="ico-rail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M14 9.5L16.5 12 14 14.5"/></svg>
        </button>
      </div>
      <button class="btn new-chat" id="newSession" title="New session">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">New session</span>
      </button>
    </div>
    <nav class="chat-list" id="sessionList"></nav>
    <!-- What a session just did, for a reader that cannot see the sidebar. It
         is the only place the activity of a row is put into words, and it is
         throttled so a busy machine does not talk over itself. -->
    <div class="sr-only" id="activityLive" role="status" aria-live="polite"></div>
    <div class="side-foot">
      <a class="btn" href="/admin" title="Admin">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        <span class="btn-label">Admin</span>
      </a>
      <button class="btn" id="logout" title="Sign out">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span class="btn-label">Sign out</span>
      </button>
    </div>
  </aside>

  <!-- The scrim behind the drawer is a real element rather than a pseudo
       element on the body, because it has to be tappable: iOS only delivers a
       click to something that carries a handler of its own, and tapping beside
       a drawer is how a drawer is closed on a phone. -->
  <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <!-- The name is edited where it is read: a click makes it editable and
           Enter or leaving it commits. -->
      <div class="title" id="sessionTitle">Socrates</div>
      <!-- Where the person filed this session. In progress, what every session
           starts as, says nothing. -->
      <span class="tag status" id="sessionStatus" hidden></span>
      <!-- Account limits and this conversation's estimated API-equivalent
           cost, and how long until each limit renews; the exact time is in
           the native tooltip. -->
      <div class="usage-strip" id="sessionUsage" hidden></div>
      <!-- Copy, paste and upload (transfer.js). In the bar at a desk; on a
           phone the bar is full, and the three float over the top corner of
           the pane instead. Hidden until a terminal is attached. -->
      <div class="transfer" id="transfer" hidden>
        <button class="icon-btn" id="copyBtn" type="button" title="Copy" aria-label="Copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11.5" height="11.5" rx="2"/><path d="M5.5 15H5a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 5 3.5h8.5A1.5 1.5 0 0 1 15 5v.5"/></svg>
        </button>
        <button class="icon-btn" id="pasteBtn" type="button" title="Paste" aria-label="Paste">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="2.5" width="7" height="4" rx="1"/><path d="M15.5 4.5h2A1.5 1.5 0 0 1 19 6v13.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5V6a1.5 1.5 0 0 1 1.5-1.5h2"/></svg>
        </button>
        <button class="icon-btn" id="uploadBtn" type="button" title="Upload a file" aria-label="Upload a file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5l-8.2 8.2a5.3 5.3 0 0 1-7.5-7.5l8.2-8.2a3.5 3.5 0 0 1 5 5l-8.2 8.2a1.8 1.8 0 0 1-2.5-2.5l7.6-7.6"/></svg>
        </button>
      </div>
      <!-- What this session is doing, said out loud, and how to talk into it
           without a keyboard. Both are hidden until there is a session to
           attach them to. -->
      <!-- The drawing is what the button does: a screen with words on it, and
           the same two arcs the loudspeaker beside it uses coming off the
           side. Not a speech bubble - a bubble is somebody talking, and what
           this does is read out what is already on the pane. -->
      <button class="icon-btn" id="statusBtn" title="Summarize this session" aria-label="Summarize this session" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="13.5" height="12" rx="2"/><path d="M5.2 10.4h7M5.2 13.6h4"/><path d="M17.6 9.4a4 4 0 0 1 0 5.2"/><path d="M20.4 7.2a7.5 7.5 0 0 1 0 9.6"/></svg>
      </button>
      <!-- Speaking into the session. It keeps its word and a generous touch
           area at a desk; on a narrow bar the word gives way before the icon. -->
      <button class="pill" id="micBtn" type="button" title="Speak" aria-label="Speak" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span class="pill-text" id="micText">Speak</span>
      </button>
      <!-- The on-screen keyboard. On a touch screen nothing else raises it:
           the pane and every field are muted until this is pressed, and a
           second press puts the keyboard away again (keyboard.js). A copy of
           it sits over this spot in every dialog, so it can be pressed there
           too. Filled while the keyboard is up, like a modifier armed on the
           key bar. On a device with a mouse it is not shown at all. -->
      <button class="icon-btn" id="kbBtn" type="button" aria-pressed="false"
              title="Show the keyboard" aria-label="Show the keyboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M6.3 9.4h.01M10.1 9.4h.01M13.9 9.4h.01M17.7 9.4h.01M6.3 12.2h.01M17.7 12.2h.01M8 15h8"/></svg>
      </button>
      <!-- How a session that has finished reaches somebody who is not looking
           at this page. Both are facts about this device rather than about a
           session, so unlike everything else in this bar they are here
           whether or not one is attached. Each shows the state it is in: the
           same drawing, with a stroke through it when it is off. -->
      <button class="icon-btn toggle" id="soundBtn" type="button" aria-pressed="true"
              title="Sound on" aria-label="Sound on">
        <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M3 3l18 18"/></svg>
      </button>
      <button class="icon-btn toggle" id="notifyBtn" type="button" aria-pressed="false"
              title="Notifications off" aria-label="Notifications off">
        <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8.5-3 8.5h18S18 15 18 8"/><path d="M13.7 20.5a2 2 0 0 1-3.4 0"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8.5-3 8.5h18S18 15 18 8"/><path d="M13.7 20.5a2 2 0 0 1-3.4 0"/><path d="M3 3l18 18"/></svg>
      </button>
      <button class="icon-btn" id="sessionMenu" title="Session actions" hidden aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
    </header>

    <!-- The terminal takes the whole area under the bar. -->
    <div class="stage" id="stage">
      <div class="term-wrap" id="termWrap">
        <div class="term-host" id="term"></div>
        <!-- Blocks the terminal: it ended, it could not start, or it is coming
             back after a reboot. -->
        <div class="term-overlay" id="termOverlay" hidden></div>
        <!-- The two lines that may sit over the top of the pane: the notice,
             which is dismissible and never blocks, and under it the ticker,
             which is one line at a time of what is happening right now. -->
        <div class="term-lines" id="termLines">
          <div class="term-notice" id="termNotice" hidden></div>
          <div class="term-ticker" id="termTicker" hidden>
            <div class="ticker-window" id="tickerWindow" role="status" aria-live="polite"></div>
          </div>
        </div>
        <!-- Before the first session exists there is nothing to attach to. -->
        <div class="term-empty" id="termEmpty" hidden></div>
      </div>
    </div>

    <!-- The keys a phone keyboard does not have. keybar.js fills them in; the
         session menu is what puts the bar on screen, on any device. -->
    <div class="keybar" id="keybar" hidden></div>
  </main>
</div>

<!-- The new session sheet: which program, where it works, and what it runs on.
     A session is bound to all three before it exists, so they are chosen once
     rather than guessed at and corrected afterwards. -->
<dialog class="sheet" id="newSessionSheet" aria-label="Start a new session">
  <h2 class="sheet-title">What should this session run?</h2>
  <div class="seg-row agents" id="nsHarness" role="group" aria-label="Agent"></div>
  <!-- The shell is not an agent: nothing is asked of it and nothing is
       reported back. It sits on a row of its own under the agents, so the
       choice reads as two kinds of thing. VS Code is not on the sheet at all:
       a folder has one editor, opened from its mark in the sidebar. -->
  <div class="seg-row agents tools" id="nsTools" role="group" aria-label="Tool"></div>
  <div class="field" id="nsShellExecutionField" hidden>
    <label>Shell execution</label>
    <div class="seg-row" id="nsShellExecution" role="group" aria-label="Shell execution">
      <button class="seg" type="button" data-value="host" aria-pressed="false">
        <span class="seg-text"><span class="seg-label">Host</span><span class="seg-sub">redirect to host</span></span>
      </button>
      <button class="seg" type="button" data-value="container" aria-pressed="false">
        <span class="seg-text"><span class="seg-label">Container</span><span class="seg-sub">run inside container</span></span>
      </button>
    </div>
    <div class="hint" id="nsShellExecutionHint"></div>
  </div>
  <!-- Which sign-ins the session runs on. Only there when the dashboard has
       more profiles than the default one. -->
  <div class="field" id="nsProfileField" hidden>
    <label>Profile</label>
    <div id="nsProfile"></div>
    <div class="hint" id="nsProfileHint"></div>
  </div>
  <div class="field" id="nsDirField">
    <label>Working directory</label>
    <div id="nsDir"></div>
    <input class="input mono" type="text" id="nsDirPath" spellcheck="false" hidden
           autocorrect="off" autocapitalize="none" placeholder="/srv/projects/socrates">
    <div class="hint mono" id="nsDirHint"></div>
  </div>
  <div class="field" id="nsModelField">
    <label>Model</label>
    <div id="nsModel"></div>
  </div>
  <div class="field" id="nsEffortField" hidden>
    <label>Effort</label>
    <div class="seg-row" id="nsEffort" role="group" aria-label="Reasoning effort"></div>
  </div>
  <!-- Claude Code only. Off every time the sheet opens, and fixed for the
       session's life once it is started. -->
  <div class="field" id="nsUltracodeField" hidden>
    <label>Ultracode</label>
    <div class="seg-row" id="nsUltracode" role="group" aria-label="Ultracode">
      <button class="seg" type="button" data-value="off" aria-pressed="true">
        <span class="seg-text"><span class="seg-label">Off</span></span>
      </button>
      <button class="seg" type="button" data-value="on" aria-pressed="false">
        <span class="seg-text"><span class="seg-label">On</span></span>
      </button>
    </div>
    <div class="hint">Dynamic workflows on every task: Claude Code orchestrates several agents for each request, which uses much more of the account's limits.</div>
  </div>
  <div class="hint" id="nsHint"></div>
  <div class="sheet-actions">
    <button class="btn sm" type="button" id="nsCancel">Cancel</button>
    <button class="btn sm primary" type="button" id="nsStart">Start session</button>
  </div>
</dialog>

<!-- The recording sheet. A recording is the whole screen while it runs, because
     what is being asked of it - keep this, or throw it away - is the only thing
     being asked, and both answers have to be findable without looking. The
     meter is there so that a microphone that hears nothing looks like one. -->
<dialog class="sheet rec-sheet" id="recSheet" aria-label="Recording">
  <h2 class="sheet-title">Listening…</h2>
  <div class="rec-meter" id="recMeter" aria-hidden="true"></div>
  <div class="rec-time mono" id="recTime">0:00</div>
  <div class="rec-buttons">
    <button class="btn primary rec-big" type="button" id="recSend">Send</button>
    <button class="btn rec-big" type="button" id="recCancel">Cancel</button>
  </div>
</dialog>

<div class="toasts" id="toasts"></div>

<!-- The vendored bundles are plain UMD scripts that define browser globals -
     Terminal, FitAddon, Unicode11Addon, WebLinksAddon,
     WebglAddon - so they come before the module that uses them. They are not
     ESM; nothing imports them. -->
<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/vendor/addon-unicode11.js"></script>
<script src="/static/vendor/addon-web-links.js"></script>
<script src="/static/vendor/addon-webgl.js"></script>
<script type="module" src="/static/js/session.js"></script>
</body>
</html>
